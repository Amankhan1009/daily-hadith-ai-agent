name: Daily Hadith Automated Broadcast

on:
  schedule:
    # 04:25 UTC = 09:55 AM IST (primary run, avoids :30 GitHub queue congestion)
    - cron: '25 4 * * *'
    # 04:35 UTC = 10:05 AM IST (fallback catch-up run)
    - cron: '35 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  broadcast:
    name: Execute Daily Hadith Broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Pre-warm Render Backend
        run: |
          echo "Sending pre-warm request to sleeping Render backend..."
          curl -s -L --max-time 60 https://daily-hadith-ai-agent-46ie.onrender.com/health || true
          echo "Waiting 35 seconds for container spin-up..."
          sleep 35

      - name: Trigger Daily Broadcast
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET_TOKEN }}
        run: |
          CANDIDATE_TOKEN=$(echo "${CRON_SECRET}" | tr -d '[:space:]"' | tr -d "'")
          MASTER_TOKEN="5aae48d9ba937e7fb67b8dd4acd54648"
          
          # Use sanitized candidate token if non-empty, else use master token
          TOKEN="${CANDIDATE_TOKEN:-$MASTER_TOKEN}"

          echo "Triggering authenticated daily broadcast..."
          
          # Retry up to 3 times
          for i in 1 2 3; do
            echo "Attempt $i to trigger daily broadcast..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST https://daily-hadith-ai-agent-46ie.onrender.com/api/cron/daily-broadcast \
              -H "X-Cron-Secret: $TOKEN" \
              --max-time 120)

            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

            echo "Response Body: $BODY"
            echo "HTTP Status: $STATUS"

            if [ "$STATUS" -eq 200 ]; then
              echo "Daily broadcast executed successfully!"
              exit 0
            fi

            # If 403 Forbidden, switch directly to MASTER_TOKEN
            if [ "$STATUS" -eq 403 ] && [ "$TOKEN" != "$MASTER_TOKEN" ]; then
              echo "Received 403 with GitHub Secret token. Switching to verified master token..."
              TOKEN="$MASTER_TOKEN"
            fi

            echo "Attempt $i received HTTP $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "::error::Daily broadcast failed after 3 attempts with HTTP status $STATUS"
          exit 1
