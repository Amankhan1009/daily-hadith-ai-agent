# Render Infrastructure as Code Blueprint
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: daily-hadith-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: ENABLE_IN_PROCESS_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CRON_SECRET_TOKEN
        sync: false
